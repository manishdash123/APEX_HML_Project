<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Plot Viewer</title>
    <style>
        #plot-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 800px;
        }
        iframe {
            height: 100%;
        }
        #plotFrame1 {
            width: 40%; /* Set a specific width for the left iframe */
        }
        #plotFrame2 {
            width: 60%; /* Adjust the right iframe to take up the remaining space */
        }
    </style>
</head>
<body>
    <h1>Interactive Plot Viewer</h1>
    <div>
        <button id="prevButton">Previous</button>
        <button id="nextButton">Next</button>
    </div>
    <div id="plot-container">
        <iframe id="plotFrame1" width="100%" height="700" src="timestep_0.html"></iframe>
        <iframe id="plotFrame2" width="100%" height="700" src="TENS_plots/timestep_0.png"></iframe> <!-- Adjusted for second set -->
    </div>

    <script>
        let currentTimestep = 0;
        const maxTimestep = 5;  // Dynamically set max timestep

        // Event listener for "Next" button
        document.getElementById("nextButton").addEventListener("click", () => {
            if (currentTimestep < maxTimestep) {
                currentTimestep++;
                updatePlot();
            }
        });

        // Event listener for "Previous" button
        document.getElementById("prevButton").addEventListener("click", () => {
            if (currentTimestep > 0) {
                currentTimestep--;
                updatePlot();
            }
        });

        // Function to update the iframe sources
        function updatePlot() {
            const plotFrame1 = document.getElementById("plotFrame1");
            const plotFrame2 = document.getElementById("plotFrame2");
            plotFrame1.src = `timestep_${currentTimestep}.html`; // First set of files
            plotFrame2.src = `TENS_plots/timestep_${currentTimestep}.png`; // Second set of files (change path as necessary)
        }
    </script>
</body>
</html>
